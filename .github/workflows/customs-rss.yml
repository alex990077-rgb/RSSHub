name: Customs RSS

# 海关查获情报 · RSSHub 通道（全部只在本仓库内，不动其他任何文件）
#
#   本文件                              .github/workflows/customs-rss.yml
#   抓取/过滤/去重/推送脚本              scripts/customs_rss.py
#   去重台账（脚本自动生成并提交）        seen_rss.json
#
# 仓库变量（Settings → Secrets and variables → Actions → Variables）
#   RSSHUB_BASE      自建/公共 RSSHub 地址；留空 = 优先用下面自建实例，起不来就用内置兜底链
#   RSSHUB_FALLBACK  覆盖内置兜底链（逗号分隔）
#   SELFHOST_RSSHUB  控制「自建 RSSHub 实例」那一步：留空或填 1 = 开（默认），填 0 = 关
#   FETCH_WORKERS / FETCH_TIMEOUT / FETCH_DEADLINE  抓取并发/单请求超时/总预算（默认 8 / 25 / 900）
# 仓库密钥（Secrets）
#   SERVERCHAN_SENDKEY / PUSHPLUS_TOKEN / PUSHPLUS_TOPIC / WECOM_WEBHOOK
#
# ── 触发方式：只有外部调度（2026-10-06 起）────────────────────────────────────
# GitHub 内置 on.schedule 已彻底移除：本仓库实测 schedule 触发不稳定，还会和外部调度重复跑。
# 定时统一交给 cron-job.org 调 workflow_dispatch API 触发：
#   https://console.cron-job.org/jobs
# 三个任务（时区均选 Asia/Shanghai，请求方法 POST）：
#   7:30  / 15:10 / 22:10
# URL（三个任务相同）：
#   https://api.github.com/repos/alex990077-rgb/RSSHub/actions/workflows/customs-rss.yml/dispatches
# Headers：Authorization: Bearer <细粒度PAT，Actions: Read and write>
#          Accept: application/vnd.github+json
#          X-GitHub-Api-Version: 2022-11-28
#          Content-Type: application/json
# Body：   {"ref":"master","inputs":{}}
# 成功返回 204 No Content（dispatch 接口正常就不返回 body）。
# 手动测试：Actions 页面点 Run workflow；完整步骤/排错见 rsshub-cloud/cron-job.org-配置指南.md
#
# ── 抓取链路（2026-10-06 改）──────────────────────────────────────────────────
# 阶段① 直连源（kind=rss/gnews，各自独立域名）并行抓取 —— 先拿完，RSSHub 再慢也饿不死它们；
# 阶段② RSSHub 源串行抓取 + 多实例兜底（串行是为了不并发触发公共实例 429）。
# 想不依赖公共实例：默认会先在本机起一个 RSSHub（下一步），脚本优先用它，
# 起不来或拉镜像失败就自动回落 rsshub.liumingye.cn → rsshub.ktachibana.party。

on:
    workflow_dispatch:
        inputs:
            base:
                description: '临时指定 RSSHub 地址（留空=用变量或默认实例）'
                default: ''
            dry_run:
                description: '只抓取不推送（1=是）'
                default: ''
            push_test:
                description: '测试推送：每源取前 N 条（含全文、忽略去重）'
                default: ''
            selftest:
                description: '只自检推送通道，不抓取（1=是）'
                default: ''
            backfill_days:
                description: '回补模式：抓最近 N 天建存档（不推送、条目全部记账），如 30'
                default: ''
            archive_month:
                description: '存档文件名月份，如 2026-09（留空=当前月）'
                default: ''

permissions:
    contents: write

concurrency:
    group: customs-rss
    cancel-in-progress: false

jobs:
    run:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: 检出仓库（本仓库历史很大，只取最新一层 + 只取需要的路径）
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1
                  sparse-checkout: |
                      /scripts/
                      /rss-digest/
                      /archive/
                      /seen_rss.json
                      /slots.json
                  sparse-checkout-cone-mode: false

            - name: 安装 Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            # 自建 RSSHub：免限流、路由最全（公共实例经常 429/503/超时）。
            # continue-on-error：拉镜像或启动失败都不影响后面，脚本会自动回落公共实例。
            # 开关：变量留空或填 1 = 开；填 0 = 关。
            # 注意别写成 `vars.SELFHOST_RSSHUB != '0'` —— 变量没设时 GitHub 会把 null 当 0，
            # 与 '0' 松散相等，条件恒为 false，这步就被静默跳过（已踩过）。
            - name: 启动自建 RSSHub 实例（可选，失败自动回落公共实例）
              id: rsshub
              if: ${{ vars.SELFHOST_RSSHUB == '' || vars.SELFHOST_RSSHUB == '1' }}
              continue-on-error: true
              run: |
                  docker run -d --name rsshub -p 1200:1200 diygod/rsshub:chromium-bundled
                  for i in $(seq 1 60); do
                    code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:1200/ || true)
                    if [ -n "$code" ] && [ "$code" != "000" ]; then
                      echo "RSSHub 自建实例就绪（HTTP $code，等待 $((i * 3)) 秒）"
                      echo "base=http://localhost:1200" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi
                    sleep 3
                  done
                  echo "::warning title=RSSHub 自建实例未就绪::180 秒内连不上 http://localhost:1200，本轮自动回落公共实例。"
                  docker logs --tail 20 rsshub 2>&1 || true

            - name: 抓取 + 关键词过滤 + 去重 + 推送
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  RSSHUB_BASE: ${{ github.event.inputs.base || vars.RSSHUB_BASE || steps.rsshub.outputs.base }}
                  RSSHUB_FALLBACK: ${{ vars.RSSHUB_FALLBACK }}
                  FETCH_WORKERS: ${{ vars.FETCH_WORKERS || '8' }}
                  FETCH_TIMEOUT: ${{ vars.FETCH_TIMEOUT || '25' }}
                  FETCH_DEADLINE: ${{ vars.FETCH_DEADLINE || '900' }}
                  SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
                  PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
                  PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
                  WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
                  DRY_RUN: ${{ github.event.inputs.dry_run }}
                  PUSH_TEST: ${{ github.event.inputs.push_test }}
                  SELFTEST: ${{ github.event.inputs.selftest }}
                  LOOSE: ${{ vars.LOOSE }}
                  NOTIFY_WHEN_EMPTY: ${{ vars.NOTIFY_WHEN_EMPTY }}
                  FULLTEXT: ${{ vars.FULLTEXT || '1' }}
                  # 保存到 rss-digest/*.md 的条目是否也带正文（1=带全文，0=只存标题+链接）
                  DIGEST_FULLTEXT: ${{ vars.DIGEST_FULLTEXT || '1' }}
                  # 保存时单条正文上限（留空=TEXT_LIMIT；0=不限）
                  DIGEST_TEXT_LIMIT: ${{ vars.DIGEST_TEXT_LIMIT || '' }}
                  TRANSLATE: ${{ vars.TRANSLATE || '1' }}
                  TRANSLATE_BODY: ${{ vars.TRANSLATE_BODY || '1' }}
                  MIN_TEXT: ${{ vars.MIN_TEXT || '300' }}
                  BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
                  ARCHIVE_MONTH: ${{ github.event.inputs.archive_month }}
                  TEXT_LIMIT: ${{ vars.TEXT_LIMIT || '6000' }}
                  PUSH_LIMIT: ${{ vars.PUSH_LIMIT || '28000' }}
              run: python scripts/customs_rss.py

            - name: 保存去重台账与每日结果（跨天不重复推送）
              if: always()
              continue-on-error: true
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add seen_rss.json rss-digest archive slots.json 2>/dev/null || true
                  if git diff --cached --quiet; then
                    echo "无状态变化，跳过提交"
                  else
                    git commit -m "digest(rss): $(TZ='Asia/Hong_Kong' date '+%F %H:%M')"
                    git push
                  fi
